<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=2.0, minimum-scale=1.0, user-scalable=none">
  <title>Point of.</title>
  <link rel="shortcut icon" href="./img/f.png" type="image/x-icon">
  <!---->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  <link rel="stylesheet" href="./find_pw.css">
  <script src="./find_pw.js"></script>
</head>
<body>
  <header class="header">
    <button type="button" class="back" id="back">
      <img src="./img/angle_left_solidcopy.png" alt="">
    </button>
  </header>
  <div class="wrap">
    <div class="find_pw">
      <div class="find_pw_title">
        <p>비밀번호 찾기</p>
      </div>
      <div class="find">
        <ul class="find_tab">
          <li class="on_tab">전화번호</li>
          <li>이메일</li>
        </ul>
        <div class="find_sheet">
          <div class="on_sheet">
            <div class="tel_name">
              <label for="">이름</label>
              <input type="text" class="tel_find" id="tel_find" placeholder="이름을 입력해주세요" autofocus>
            </div>
            <div class="tel_tel">
              <label for="">전화번호</label>
              <div class="tel_box">
                <div class="tel_in">
                  <select name="tel" id="tel" class="tel">
                    <option>선택</option>
                    <option>010</option>
                    <option>051</option>
                  </select>
                  - <input type="text" class="tel_second" id="tel_second" size="10px">
                  - <input type="text" class="tel_third" id="tel_third" size="10px">
                </div>
                <div class="tel_btn">
                  <button type="button" class="tel_btn" id="tel_btn">전화번호 확인</button>
                </div>
              </div>
            </div>
            <div class="tel_num">
              <input type="text" class="num" id="num" placeholder="951753">
              <button type="button" class="btn_num" id="btn_num">인증번호 확인</button>
            </div>
            <div class="btn_next">
              <button type="button" class="btn_next" id="btn_next">비밀번호 찾기</button>
            </div>
          </div><!--tel-->
          <div>
            <div class="email_name">
              <label for="">이름</label>
              <input type="text" class="email_find" id="email_find">
            </div>
            <div class="email_email">
              <label for="">이메일</label>
              <div class="email_do">
                <input type="text" id="user_email" class="user_email">
                <span>@</span>
                <input type="text" id="email" class="email">
                <select name="emails" id="emails">
                  <option>직접입력</option>
                  <option>naver.com</option>
                  <option>google.com</option>
                  <option>daum.net</option>
                  <option>apple.com</option>
                </select>
              </div>
            </div>
            <div class="next_btn">
              <button type="button" class="next_btn" id="next_btn">비밀번호 찾기</button>
            </div>
          </div><!--email-->
        </div>
      </div>
    </div>
  </div><!--wrap-->
  <div class="popup">
    <div class="popup_title">
      <p>새 비밀번호 설정</p>
    </div>
    <div class="new">
      <label for="">새 비밀번호 입력</label>
      <input type="text" class="new_pw" id="new_pw">
    </div>
    <div class="new01">
      <label for="">비밀번호 다시 입력</label>
      <input type="text" class="new_pw01" id="new_pw01">
    </div>
    <button type="button" class="btn_chk">확인</button>
  </div>
</body>
</html>
